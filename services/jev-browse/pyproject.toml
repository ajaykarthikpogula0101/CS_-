[project]
name = "champset-jev-browse"
version = "0.1.0"
description = "HTTP sidecar running jev-ultrafast browser tasks for ChampSet's browse_page tool."
requires-python = ">=3.12"
# Pinned: the sidecar relies on jev-ultrafast's Agent state shape.
dependencies = [
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast@1231850a0bf1a0c0341fe408ef1668dbbfdfac46",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["browser: needs a local Chrome (skipped when none is found)"]
